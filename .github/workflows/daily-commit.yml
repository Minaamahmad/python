name: Daily Automated Commit

on:
  schedule:
    # Runs at 00:00 UTC every day (Adjust UTC time as needed)
    - cron: '0 0 * * *'
  # Allows manual triggers from the Actions tab
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make a change to a log file
        run: |
          echo "Automated commit on $(date -u)" >> automated_log.txt

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add automated_log.txt
          git commit -m "chore: daily automated update [skip ci]" || exit 0
          git push
