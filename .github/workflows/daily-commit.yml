name: Daily Conditional Automated Commit

on:
  schedule:
    # Runs at 23:50 UTC every day
    - cron: '50 23 * * *'
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check if a commit was made today
        id: check_commit
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          LATEST_COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d')
          
          if [ "$LATEST_COMMIT_DATE" = "$TODAY" ]; then
            echo "A commit was already made today ($TODAY). Skipping automatic commit."
            echo "COMMITTED_TODAY=true" >> $GITHUB_OUTPUT
          else
            echo "No commits found for today ($TODAY). Proceeding with auto-commit."
            echo "COMMITTED_TODAY=false" >> $GITHUB_OUTPUT
          fi

      - name: Make a change and push
        if: steps.check_commit.outputs.COMMITTED_TODAY == 'false'
        run: |
          echo "Automated backfill commit on $(date -u)" >> automated_log.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add automated_log.txt
          git commit -m "chore: automated daily activity check [skip ci]"
          git push
